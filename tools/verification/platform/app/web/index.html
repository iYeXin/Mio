<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Platform Check</title>
    <style>
      :root {
        --paper: #fbfaf7;
        --ink: #16150f;
        --muted: #6f6b60;
        --rule: #dcd8cd;
        --pass: #1f6b3a;
        --fail: #a3341f;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font: 13px/1.55 "Iowan Old Style", "Palatino Linotype", Georgia, serif;
        -webkit-font-smoothing: antialiased;
      }
      .sheet { max-width: 760px; margin: 0 auto; padding: 40px 32px 56px; }
      .masthead {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        border-bottom: 1px solid var(--ink);
        padding-bottom: 10px;
      }
      .wordmark { font: 600 13px/1 ui-monospace, "Cascadia Mono", monospace; letter-spacing: 0.22em; }
      .meta { font: 11px/1 ui-monospace, "Cascadia Mono", monospace; color: var(--muted); letter-spacing: 0.04em; }
      h1 { font-size: 30px; line-height: 1.15; font-weight: 400; margin: 26px 0 6px; letter-spacing: -0.01em; }
      .lede { color: var(--muted); margin: 0 0 28px; max-width: 58ch; }
      .cases { border-top: 1px solid var(--rule); }
      .case {
        display: grid;
        grid-template-columns: 30px 1fr auto;
        gap: 14px;
        align-items: baseline;
        padding: 13px 0;
        border-bottom: 1px solid var(--rule);
      }
      .no { font: 11px/1 ui-monospace, "Cascadia Mono", monospace; color: var(--muted); }
      .name { display: block; }
      .detail { display: block; font: 12px/1.5 ui-monospace, "Cascadia Mono", monospace; color: var(--muted); }
      .status { font: 11px/1 ui-monospace, "Cascadia Mono", monospace; letter-spacing: 0.08em; }
      .status.pass { color: var(--pass); }
      .status.fail { color: var(--fail); }
      .status.wait { color: var(--muted); }
      .colophon {
        margin-top: 26px;
        display: flex;
        justify-content: space-between;
        gap: 16px;
        font: 11px/1.6 ui-monospace, "Cascadia Mono", monospace;
        color: var(--muted);
        border-top: 1px solid var(--ink);
        padding-top: 10px;
      }
    </style>
  </head>
  <body>
    <div class="sheet">
      <div class="masthead">
        <span class="wordmark">MIO / PLATFORM</span>
        <span class="meta" id="platform">connecting…</span>
      </div>

      <h1>Platform API check</h1>
      <p class="lede">
        HTTP client, in-app server, transfers with progress, notifications, the
        gallery picker, the foreground service and window helpers.
      </p>

      <div class="cases" id="cases"></div>

      <div class="colophon">
        <span id="features">features: ?</span>
        <span id="stamp">—</span>
      </div>
    </div>

    <script>
      const cases = [
        ["http.request", "GET https://example.com through Dart, bypassing CORS"],
        ["http.request body", "POST to the in-app server and read the echo"],
        ["http.serve + onRequest", "server answers /ping on loopback"],
        ["http.download", "writes the response into the sandbox"],
        ["http.download progress", "receives http.progress events with totals"],
        ["http.upload", "streams the downloaded file back to the server"],
        ["notify.send", "posts a system notification"],
        ["notify.progress", "updates a progress notification, then cancels it"],
        ["media.pickImage", "opens the gallery picker (manual)"],
        ["foreground.start/stop", "starts the Android foreground service"],
        ["window.setDecorations", "toggles decorations and resizes (Windows)"],
        ["window visibility / shadow", "hide+show, shadow toggle, state fields"],
        ["process.exec", "runs `cmd /c echo` and captures stdout"],
        ["process.pid / env / args", "app pid, PATH present, launch args array"],
        ["platform.display", "screen bounds, work area and scale factor"],
        ["fs grants", "an absolute path without a dialog grant is refused"],
        ["window.fitToWorkArea", "sizes the window into the usable desktop area"],
        ["platform.setSystemBars", "colors the Android status bar"],
        ["storage.request", "asks for gallery read permission"],
        ["media.saveImage", "writes a generated PNG into Pictures/Mio"],
      ];

      const list = document.getElementById("cases");
      const rows = cases.map(([name, hint], index) => {
        const row = document.createElement("div");
        row.className = "case";
        row.innerHTML =
          '<span class="no">' + String(index + 1).padStart(2, "0") + "</span>" +
          '<span><span class="name"></span><span class="detail"></span></span>' +
          '<span class="status wait">WAIT</span>';
        row.querySelector(".name").textContent = name;
        row.querySelector(".detail").textContent = hint;
        list.appendChild(row);
        return row;
      });

      function settle(index, ok, detail) {
        const row = rows[index];
        const status = row.querySelector(".status");
        status.className = "status " + (ok ? "pass" : "fail");
        status.textContent = ok ? "PASS" : "FAIL";
        if (detail) row.querySelector(".detail").textContent = detail;
      }

      function settleState(index, label, detail, className) {
        const row = rows[index];
        const status = row.querySelector(".status");
        status.className = "status " + (className || "wait");
        status.textContent = label;
        if (detail) row.querySelector(".detail").textContent = detail;
      }

      function finish() {
        const pass = rows.filter((row) => row.querySelector(".status").textContent === "PASS").length;
        document.getElementById("stamp").textContent = pass + "/" + rows.length + " pass";
      }

      const base = { server: null };

      async function startServer() {
        if (base.server) return base.server;
        base.server = await window.Mio.invoke("http.serve", { port: 0 });
        await window.Mio.on("http.request", async (request) => {
          if (request.path === "/ping") {
            await window.Mio.invoke("http.respond", {
              id: request.id,
              status: 200,
              headers: { "content-type": "text/plain" },
              body: "pong",
            });
            return;
          }
          if (request.path === "/upload") {
            await window.Mio.invoke("http.respond", {
              id: request.id,
              status: 200,
              headers: { "content-type": "application/json" },
              body: JSON.stringify({ received: atob(request.bodyBase64 || "").length }),
            });
            return;
          }
          await window.Mio.invoke("http.respond", {
            id: request.id,
            status: 200,
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ method: request.method, echo: atob(request.bodyBase64 || "") }),
          });
        });
        return base.server;
      }

      async function main() {
        await window.Mio.ready;
        const info = await window.Mio.invoke("app.info");
        document.getElementById("platform").textContent = info.platform + " · api " + info.apiVersion;
        const features = info.features || {};
        document.getElementById("features").textContent =
          "features: " + Object.entries(features).map(([k, v]) => k + "=" + v).join("  ");

        try {
          const response = await window.Mio.invoke("http.request", {
            url: "https://example.com/",
            timeoutMs: 15000,
          });
          settle(0, response.status === 200 && (response.text || "").length > 0,
            "status " + response.status + " · " + response.bytes + " bytes");
        } catch (error) {
          settle(0, false, String(error.message || error));
        }

        try {
          const server = await startServer();
          const origin = "http://127.0.0.1:" + server.port;

          const ping = await window.Mio.invoke("http.request", { url: origin + "/ping" });
          settle(2, ping.status === 200 && ping.text === "pong", "port " + server.port + " · pong");

          const echo = await window.Mio.invoke("http.request", {
            url: origin + "/echo",
            method: "POST",
            headers: { "content-type": "text/plain" },
            body: "hello",
          });
          const parsed = JSON.parse(echo.text);
          settle(1, parsed.echo === "hello" && parsed.method === "POST", "POST echoed hello");

          const path = "downloads/example.html";
          const downloaded = await window.Mio.invoke("http.download", {
            url: "https://example.com/",
            path,
            id: "check-download",
            timeoutMs: 15000,
          });
          const stat = await window.Mio.invoke("fs.stat", { path });
          settle(3, downloaded.status === 200 && stat && stat.size === downloaded.bytes,
            path + " · " + downloaded.bytes + " bytes");

          // Progress events for the same download id.
          const events = [];
          await window.Mio.on("http.progress", (event) => {
            if (event.id === "check-download") events.push(event);
          });
          const again = await window.Mio.invoke("http.download", {
            url: "https://example.com/",
            path: "downloads/progress.html",
            id: "check-download",
            timeoutMs: 15000,
          });
          settle(4, again.bytes > 0, events.length + " progress events · last " +
            JSON.stringify(events.at(-1) || null));

          const upload = await window.Mio.invoke("http.upload", {
            url: origin + "/upload",
            path,
            id: "check-upload",
          });
          const uploaded = JSON.parse(upload.body || "{}");
          settle(5, upload.status === 200 && uploaded.received === downloaded.bytes,
            "server received " + uploaded.received + " bytes");
        } catch (error) {
          const message = String(error.message || error);
          settle(1, false, message);
          settle(2, false, message);
          settle(3, false, message);
          settle(4, false, message);
          settle(5, false, message);
        }

        if (!features.notify) {
          settleState(6, "SKIP", "not available on " + info.platform, "wait");
          settleState(7, "SKIP", "not available on " + info.platform, "wait");
        } else {
          try {
            await window.Mio.invoke("notify.send", { title: "Platform check", body: "notify.send" });
            settle(6, true, "notification posted");
          } catch (error) {
            settle(6, false, String(error.message || error));
          }
          try {
            await window.Mio.invoke("notify.progress", {
              id: 4102,
              title: "Progress",
              text: "half way",
              progress: 50,
              max: 100,
            });
            await window.Mio.invoke("notify.cancel", { id: 4102 });
            settle(7, true, "progress shown, then cancelled");
          } catch (error) {
            settle(7, false, String(error.message || error));
          }
        }

        if (!features.media) {
          settleState(8, "SKIP", "not available on " + info.platform, "wait");
        } else {
          settleState(8, "OPEN", "click this row to open the picker", "wait");
          rows[8].style.cursor = "pointer";
          rows[8].addEventListener("click", async () => {
            try {
              const picked = await window.Mio.invoke("media.pickImage");
              settle(8, true, picked ? picked.path + " · " + picked.size + " bytes" : "cancelled");
            } catch (error) {
              settle(8, false, String(error.message || error));
            }
            finish();
          });
        }

        if (!features.foreground) {
          settleState(9, "SKIP", "not declared or not Android", "wait");
        } else {
          try {
            await window.Mio.invoke("foreground.start", { title: "Check", text: "running" });
            const state = await window.Mio.invoke("foreground.info");
            const stopped = await window.Mio.invoke("foreground.stop");
            settle(9, state.running === true && stopped.running === false, "started, reported running, stopped");
          } catch (error) {
            settle(9, false, String(error.message || error));
          }
        }

        if (!features.window) {
          settleState(10, "SKIP", "window control unavailable", "wait");
        } else {
          try {
            const before = await window.Mio.invoke("window.state");
            await window.Mio.invoke("window.setDecorations", { decorations: false });
            await window.Mio.invoke("window.setMinimumSize", { width: 640, height: 480 });
            await window.Mio.invoke("window.setResizable", { resizable: true });
            await window.Mio.invoke("window.setDecorations", { decorations: true });
            settle(10, before.width > 0, "decorations off/on, min size applied");
          } catch (error) {
            settle(10, false, String(error.message || error));
          }
        }

        if (!features.window) {
          settleState(11, "SKIP", "window control unavailable", "wait");
        } else {
          try {
            await window.Mio.invoke("window.setHasShadow", { hasShadow: true });
            await window.Mio.invoke("window.setVisible", { visible: false });
            await window.Mio.invoke("window.setVisible", { visible: true });
            const state = await window.Mio.invoke("window.state");
            settle(11, state.isVisible === true && state.hasShadow === true,
              "visible=" + state.isVisible + " shadow=" + state.hasShadow +
              " focused=" + state.isFocused);
          } catch (error) {
            settle(11, false, String(error.message || error));
          }
        }

        if (!features.process) {
          settleState(12, "SKIP", "process API is Windows only", "wait");
          settleState(13, "SKIP", "process API is Windows only", "wait");
        } else {
          try {
            const result = await window.Mio.invoke("process.exec", {
              command: "echo mio-exec",
              timeoutMs: 10000,
            });
            settle(12, result.code === 0 && result.stdout.includes("mio-exec"),
              "exit " + result.code + " · " + result.durationMs + " ms");
          } catch (error) {
            settle(12, false, String(error.message || error));
          }
          try {
            const pid = await window.Mio.invoke("process.pid");
            const env = await window.Mio.invoke("process.env", { names: ["PATH"] });
            const args = await window.Mio.invoke("process.args");
            settle(13, pid.pid > 0 && (env.env.PATH || "").length > 0 && Array.isArray(args.args),
              "pid " + pid.pid + " · PATH " + (env.env.PATH ? "present" : "missing") +
              " · args " + args.args.length);
          } catch (error) {
            settle(13, false, String(error.message || error));
          }
        }

        try {
          const display = await window.Mio.invoke("platform.display");
          settle(14, display.scaleFactor > 0 && display.bounds.width > 0,
            display.bounds.width + "x" + display.bounds.height + " @" + display.scaleFactor +
            (display.workArea ? " · workArea " + display.workArea.width + "x" + display.workArea.height : ""));
        } catch (error) {
          settle(14, false, String(error.message || error));
        }

        try {
          const absolute = info.platform === "windows" ? "C:\\\\Windows\\\\win.ini" : "/etc/hosts";
          await window.Mio.invoke("fs.readText", { path: absolute });
          settle(15, false, "absolute path was accepted without a grant");
        } catch (error) {
          settle(15, error.code === "FS_FORBIDDEN", "refused: " + (error.code || error.message));
        }

        if (!features.window) {
          settleState(16, "SKIP", "window control unavailable", "wait");
        } else {
          try {
            const fitted = await window.Mio.invoke("window.fitToWorkArea", { margin: 24 });
            settle(16, fitted.width > 0 && fitted.height > 0,
              fitted.width + "x" + fitted.height);
          } catch (error) {
            settle(16, false, String(error.message || error));
          }
        }

        if (info.platform !== "android") {
          settleState(17, "SKIP", "Android only", "wait");
        } else {
          try {
            await window.Mio.invoke("platform.setSystemBars", {
              statusBarColor: "#13120f",
              statusBarIcons: "light",
              navigationBarColor: "#13120f",
              navigationBarIcons: "light",
            });
            settle(17, true, "status bar tinted");
          } catch (error) {
            settle(17, false, String(error.message || error));
          }
        }

        if (!features.storage) {
          settleState(18, "SKIP", "Android only", "wait");
          settleState(19, "SKIP", "Android only", "wait");
        } else {
          try {
            const status = await window.Mio.invoke("storage.status");
            const granted = await window.Mio.invoke("storage.request", { type: "images" });
            settle(18, typeof granted.granted === "boolean",
              "granted=" + granted.granted + " scoped=" + status.scoped);
          } catch (error) {
            settle(18, false, String(error.message || error));
          }

          try {
            const canvas = document.createElement("canvas");
            canvas.width = 64;
            canvas.height = 64;
            const context = canvas.getContext("2d");
            context.fillStyle = "#a3341f";
            context.fillRect(0, 0, 64, 64);
            context.fillStyle = "#fbfaf7";
            context.fillRect(16, 16, 32, 32);
            const blob = await new Promise((resolve) => canvas.toBlob(resolve, "image/png"));
            const bytes = new Uint8Array(await blob.arrayBuffer());
            await window.Mio.writeBlob("checks/save.png", bytes);
            const saved = await window.Mio.invoke("media.saveImage", { path: "checks/save.png", album: "Mio" });
            settle(19, Boolean(saved && saved.uri), saved.name + " · " + saved.album);
          } catch (error) {
            settle(19, false, String(error.message || error));
          }
        }

        finish();
      }

      main().catch((error) => {
        document.getElementById("platform").textContent = "error: " + (error.message || error);
      });
    </script>
  </body>
</html>
