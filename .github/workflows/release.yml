name: Release

# Building templates is the slow part, so this runs on a version tag (or by hand).
#   git tag -a v0.1.1 -m "Mio 0.1.1" && git push --follow-tags
#
# Assets produced (same names the CLI downloads):
#   manifest.json, mio-shell-universal.apk, mio-shell-arm64.apk, mio-shell-x64.apk,
#   mio-windows.zip
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Build Android templates
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shell
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.8"
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Resolve template version
        shell: bash
        run: echo "MIO_TEMPLATE_VERSION=$(node -p "require('../package.json').version")" >> "$GITHUB_ENV"

      - name: Build universal
        run: |
          flutter build apk --release -t lib/main_android.dart \
            --target-platform android-arm,android-arm64,android-x64 \
            --dart-define=MIO_TEMPLATE_VERSION="$MIO_TEMPLATE_VERSION"
          cp build/app/outputs/flutter-apk/app-release.apk ../mio-shell-universal.apk

      - name: Build arm64
        run: |
          flutter build apk --release -t lib/main_android.dart --target-platform android-arm64 \
            --dart-define=MIO_TEMPLATE_VERSION="$MIO_TEMPLATE_VERSION"
          cp build/app/outputs/flutter-apk/app-release.apk ../mio-shell-arm64.apk

      - name: Build x64
        run: |
          flutter build apk --release -t lib/main_android.dart --target-platform android-x64 \
            --dart-define=MIO_TEMPLATE_VERSION="$MIO_TEMPLATE_VERSION"
          cp build/app/outputs/flutter-apk/app-release.apk ../mio-shell-x64.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android-templates
          path: mio-shell-*.apk
          if-no-files-found: error

  windows:
    name: Build Windows template
    runs-on: windows-latest
    defaults:
      run:
        working-directory: shell
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.8"
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Resolve template version
        shell: pwsh
        run: |
          $version = (Get-Content ../package.json -Raw | ConvertFrom-Json).version
          "MIO_TEMPLATE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build
        run: flutter build windows --release -t lib/main_windows.dart --dart-define=MIO_TEMPLATE_VERSION="$env:MIO_TEMPLATE_VERSION"

      - name: Package
        shell: pwsh
        run: |
          $source = "build/windows/x64/runner/Release"
          $target = "../mio-windows.zip"
          # The archive root must be the template directory itself: the CLI
          # extracts it into the cache and expects data/ to appear at the top.
          Compress-Archive -Path "$source\*" -DestinationPath $target -Force
          Get-Item $target | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: windows-template
          path: mio-windows.zip
          if-no-files-found: error

  tools:
    name: Build tool bundle (${{ matrix.platform }})
    env:
      BUNDLETOOL_VERSION: "1.18.3"
      BUNDLETOOL_SHA256: a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
          - os: windows-latest
            platform: win32-x64
          - os: macos-latest
            platform: darwin-arm64
          - os: ubuntu-24.04-arm
            platform: linux-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build bundle
        shell: bash
        run: |
          set -euo pipefail
          PLATFORM="${{ matrix.platform }}"
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          EXTRA_LIBS=""
          if [ -n "$SDK" ] && [ -d "$SDK/build-tools" ]; then
            BT="$(ls "$SDK/build-tools" | sort -V | tail -n1)"
            BT_DIR="$SDK/build-tools/$BT"
            JAR="$BT_DIR/lib/apksigner.jar"
            ALIGN="$BT_DIR/zipalign"
            [ -f "$ALIGN" ] || ALIGN="$BT_DIR/zipalign.exe"
          else
            # arm64 Linux runners have no x86_64 Android SDK. The distro
            # zipalign links against libziparchive/libutils/liblog/libzopfli,
            # so those libraries must travel with the binary.
            sudo apt-get update -qq
            sudo apt-get install -y -qq zipalign curl
            ALIGN="$(command -v zipalign)"
            EXTRA_LIBS="$(ldd "$ALIGN" | awk '{print $3}' | grep -E '^/' || true)"
            curl -sSL -o /tmp/build-tools.zip \
              https://dl.google.com/android/repository/build-tools_r36_linux.zip
            mkdir -p /tmp/build-tools
            (command -v unzip >/dev/null && unzip -q -o /tmp/build-tools.zip -d /tmp/build-tools) || \
              (sudo apt-get install -y -qq unzip && unzip -q -o /tmp/build-tools.zip -d /tmp/build-tools)
            JAR="$(find /tmp/build-tools -name apksigner.jar | head -n1)"
          fi

          ALIGN_DIR="$(dirname "$ALIGN")"
          rm -rf staging && mkdir -p staging/tools/lib64
          cp "$JAR" staging/tools/apksigner.jar
          cp "$ALIGN" staging/tools/

          copy_lib() {
            local source="$1"
            [ -f "$source" ] || return 0
            local base
            base="$(basename "$source")"
            # Never copy the zipalign binary itself, nor the C runtime.
            [ "$base" = "$(basename "$ALIGN")" ] && return 0
            case "$base" in
              libc.so.*|libm.so.*|libdl.so.*|libpthread.so.*|librt.so.*|libgcc_s.so.*|ld-linux*|ld64.so.*) return 0 ;;
            esac
            cp -L "$source" staging/tools/lib64/
          }

          if [ "$(uname)" = "Darwin" ]; then
            DEPS="$(otool -L "$ALIGN" | tail -n +2 | awk '{print $1}')"
          else
            DEPS="$(ldd "$ALIGN" | awk '{print $3}' | grep -E '^/' || true)"
          fi
          for dep in $DEPS; do
            case "$dep" in
              "$ALIGN_DIR"/*) copy_lib "$dep" ;;
              @rpath/*) copy_lib "$ALIGN_DIR/lib64/$(basename "$dep")" ;;
            esac
          done
          for lib in $EXTRA_LIBS; do
            copy_lib "$lib"
          done

          # Explicitly keep the C++ runtime zipalign is linked against.
          for name in libc++.dylib libc++.so libc++abi.1.dylib libstdc++.so.6; do
            [ -f "$ALIGN_DIR/lib64/$name" ] && cp -L "$ALIGN_DIR/lib64/$name" staging/tools/lib64/
          done

          if [ "$(uname)" = "Darwin" ] && [ ! -f staging/tools/lib64/libc++.dylib ]; then
            echo "::error::macOS bundle is missing libc++.dylib"
            exit 1
          fi
          ls -l staging/tools staging/tools/lib64

          tar -czf "mio-tools-$PLATFORM-tools.tar.gz" -C staging/tools .
          "$JAVA_HOME/bin/jlink" --module-path "$JAVA_HOME/jmods" \
            --add-modules java.base,java.logging,jdk.crypto.ec,jdk.jartool --strip-debug --no-man-pages \
            --no-header-files --compress=zip-6 --output staging/jre
          tar -czf "mio-tools-$PLATFORM-jre.tar.gz" -C staging/jre .

          # AAB builds additionally need aapt2 + bundletool. arm64 Linux has no
          # x86_64 Android SDK, so that platform ships without the component.
          BUNDLE_ARCHIVE=""
          AAPT2="$ALIGN_DIR/aapt2"
          [ -f "$AAPT2" ] || AAPT2="$ALIGN_DIR/aapt2.exe"
          if [ -f "$AAPT2" ]; then
            mkdir -p staging/bundle
            cp "$AAPT2" staging/bundle/
            curl -sSL -o staging/bundle/bundletool.jar \
              "https://github.com/google/bundletool/releases/download/$BUNDLETOOL_VERSION/bundletool-all-$BUNDLETOOL_VERSION.jar"
            ACTUAL="$(node -e "const c=require('node:crypto'),f=require('node:fs');console.log(c.createHash('sha256').update(f.readFileSync(process.argv[1])).digest('hex'))" staging/bundle/bundletool.jar)"
            if [ "$ACTUAL" != "$BUNDLETOOL_SHA256" ]; then
              echo "::error::bundletool checksum mismatch"
              exit 1
            fi
            BUNDLE_ARCHIVE="mio-tools-$PLATFORM-bundle.tar.gz"
            tar -czf "$BUNDLE_ARCHIVE" -C staging/bundle .
          else
            echo "no aapt2 for $PLATFORM: AAB builds are not available on this platform"
          fi

          if [ -n "$BUNDLE_ARCHIVE" ]; then
            node scripts/write-tools-fragment.mjs --platform "$PLATFORM" \
              --tools "mio-tools-$PLATFORM-tools.tar.gz" \
              --jre "mio-tools-$PLATFORM-jre.tar.gz" \
              --bundle "$BUNDLE_ARCHIVE" \
              --out "manifest-$PLATFORM.json"
          else
            node scripts/write-tools-fragment.mjs --platform "$PLATFORM" \
              --tools "mio-tools-$PLATFORM-tools.tar.gz" \
              --jre "mio-tools-$PLATFORM-jre.tar.gz" \
              --out "manifest-$PLATFORM.json"
          fi
          ls -lh mio-tools-*.tar.gz manifest-*.json
      - uses: actions/upload-artifact@v4
        with:
          name: tools-${{ matrix.platform }}
          path: |
            mio-tools-${{ matrix.platform }}-tools.tar.gz
            mio-tools-${{ matrix.platform }}-jre.tar.gz
            mio-tools-${{ matrix.platform }}-bundle.tar.gz
            manifest-${{ matrix.platform }}.json
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [android, windows, tools]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: "*-template*"
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          pattern: "tools-*"
          merge-multiple: true
          path: dist-tools

      - name: Write manifests
        run: |
          node scripts/write-template-manifest.mjs
          node scripts/write-tools-manifest.mjs --dir dist-tools \
            --base "https://github.com/iYeXin/Mio/releases/download/${{ github.ref_name }}" \
            --out mio-tools.json

      - name: Show assets
        run: ls -lh *.apk *.zip manifest.json mio-tools.json dist-tools/*.tar.gz

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: Mio ${{ github.ref_name }}
          files: |
            manifest.json
            mio-tools.json
            mio-shell-universal.apk
            mio-shell-arm64.apk
            mio-shell-x64.apk
            mio-windows.zip
            dist-tools/*.tar.gz
          fail_on_unmatched_files: true