name: Publish npm

# Publishing uses npm Trusted Publishing (OIDC): the runner gets a short-lived
# token from GitHub. The npm package settings name this repository, this
# workflow and the environment below; no NPM_TOKEN secret exists.
#
# Note: a release created with GITHUB_TOKEN does not trigger further workflows,
# so this runs on the tag push itself rather than on `release: published`.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Pack without uploading"
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish packages
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - uses: actions/checkout@v4

      # packageManager in package.json decides the pnpm version.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Trusted publishing needs npm >= 11.5; Node 22 still ships npm 10.
      - name: Upgrade npm
        run: |
          npm install --global npm@latest
          npm --version

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Check version matches the tag
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::package.json is $version but the tag is $GITHUB_REF_NAME"
            exit 1
          fi
          echo "publishing $version"

      - name: Build
        run: pnpm -r build

      - name: Test
        run: pnpm -r test

      - name: Publish
        shell: bash
        run: |
          set -uo pipefail

          # Publish dependencies first. pnpm rewrites workspace:* to real
          # versions; npm publishes the tarball so provenance comes from npm.
          packages=("packages/android-tools" "packages/api" "packages/cli")
          for dir in "${packages[@]}"; do
            name="$(node -p "require('./$dir/package.json').name")"
            version="$(node -p "require('./$dir/package.json').version")"
            echo "::group::$name@$version"

            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is already on the registry, skipping"
              echo "::endgroup::"
              continue
            fi

            rm -rf /tmp/pack && mkdir -p /tmp/pack
            pnpm --filter "$name" pack --pack-destination /tmp/pack
            tarball="$(ls /tmp/pack/*.tgz)"

            if [ "${{ inputs.dry_run }}" = "true" ]; then
              echo "dry run: $tarball"
            else
              output="$(npm publish "$tarball" --access public --provenance 2>&1)"
              status=$?
              echo "$output"
              if [ $status -ne 0 ]; then
                # Job logs need authentication; annotations do not.
                echo "::error title=publish $name@$version::$(echo "$output" | tail -n 5 | tr '\n' ' ')"
                exit $status
              fi
            fi
            echo "::endgroup::"
          done
