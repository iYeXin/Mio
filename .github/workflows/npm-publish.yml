name: Publish npm

# Publishing uses npm Trusted Publishing (OIDC): the runner gets a short-lived
# token from GitHub. The npm package settings name this repository, this
# workflow and the environment below; no NPM_TOKEN secret exists.
#
# Note: a release created with GITHUB_TOKEN does not trigger further workflows,
# so this runs on the tag push itself rather than on `release: published`.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Pack without uploading"
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish packages
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - uses: actions/checkout@v4

      # packageManager in package.json decides the pnpm version.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Trusted publishing needs npm >= 11.5; Node 22 still ships npm 10.
      - name: Upgrade npm
        run: |
          npm install --global npm@latest
          npm --version

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Check version matches the tag
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::package.json is $version but the tag is $GITHUB_REF_NAME"
            exit 1
          fi
          echo "publishing $version"

      - name: Build
        run: pnpm -r build

      - name: Test
        run: pnpm -r test

      - name: Publish
        shell: bash
        run: |
          set -euo pipefail
          packages=("@iyexin/mio-android-tools" "@iyexin/mio-api" "@iyexin/mio-cli")
          for package in "${packages[@]}"; do
            echo "::group::publish $package"
            rm -rf /tmp/pack && mkdir -p /tmp/pack
            # pnpm rewrites workspace:* to real versions; npm publishes the
            # tarball so provenance is produced by npm itself.
            pnpm --filter "$package" pack --pack-destination /tmp/pack
            tarball="$(ls /tmp/pack/*.tgz)"
            if [ "${{ inputs.dry_run }}" = "true" ]; then
              echo "dry run: $tarball"
            else
              npm publish "$tarball" --access public --provenance
            fi
            echo "::endgroup::"
          done
